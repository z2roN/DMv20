name: z2ron_dm
description: z2roN_DM - 지인끼리 1:1 다이렉트(P2P) 채팅 앱 (Windows / Android)
publish_to: 'none'
version: 2.0.0+4

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc: ^0.12.0
  mqtt_client: ^10.2.0
  path_provider: ^2.1.3
  intl: ^0.19.0
  file_picker: ^8.0.0
  open_filex: ^4.7.0
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#4B55E0"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
